# Pinned images and actions: Dependabot opens a PR when a newer minor/patch
# version is out (major versions stay manual), and CI (ci.yml, incl. the
# sandbox test) checks it before you merge.
# Not covered: the shellcheck image in ci.yml (update by hand).
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /.devcontainer/base
      - /.devcontainer/proxy
      - /.devcontainer/modules/cred-gw/gateway
    schedule:
      interval: weekly
    # Major versions (Node 26 → 28, Debian bookworm → trixie, Python 3.11 → 3.12)
    # are decisions, not routine updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Python 3.11 → 3.12 is a minor step for Dependabot: only patches here
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
    groups:
      base-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Major versions (e.g. actions/checkout v4 → v7) are decisions, not routine
    # updates: check the release notes and upgrade by hand
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
